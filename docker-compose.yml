services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: bazgain_places
      POSTGRES_USER: bazgain
      POSTGRES_PASSWORD: bazgain
      TZ: UTC
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ./db/local:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bazgain -d bazgain_places"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  app:
    build: .
    environment:
      APP_ENV: development
      HTTP_ADDR: :8080
      DATABASE_URL: postgresql://bazgain:bazgain@postgres:5432/bazgain_places?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      JWT_ACCESS_SECRET: local-development-secret-at-least-32-chars
      JWT_ISSUER: bazgain
      JWT_AUDIENCE: bazgain-mobile
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

